x-reviewer: &reviewer
  build: .
  image: ai-code-reviewer:local
  environment: &reviewer-environment
    ENVIRONMENT: ${ENVIRONMENT:-development}
    SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters in .env}
    DATA_DIR: /data
    DATABASE_PATH: /data/reviewer.sqlite3
    PROJECTS_ROOT: /projects
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    DJANGO_DEBUG: "false"
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    HTTP_CONCURRENCY: ${HTTP_CONCURRENCY:-4}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    MAX_REVIEW_FILES: ${MAX_REVIEW_FILES:-100}
    MAX_REVIEW_CHARS: ${MAX_REVIEW_CHARS:-200000}
    MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
    MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-10}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-600}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    AI_PROVIDER: ${AI_PROVIDER:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    ALLOW_CLOUD_AI: ${ALLOW_CLOUD_AI:-false}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
    AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-1048576}
    AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-24000}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
    AI_MAX_COST_USD: ${AI_MAX_COST_USD:-0}
    AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-0}
    AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-0}
  volumes:
    - reviewer-data:/data
    - ${PROJECTS_DIRECTORY:-./projects}:/projects:ro
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  init:
    <<: *reviewer
    command:
      - /bin/sh
      - -ec
      - >-
        python -m app.cli init-db &&
        python admin_panel/manage.py migrate --noinput &&
        python admin_panel/manage.py collectstatic --noinput
    healthcheck:
      disable: true
    restart: "no"

  app:
    <<: *reviewer
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    <<: *reviewer
    command: ["uvicorn", "admin_panel.asgi:application", "--app-dir", "/app/admin_panel", "--host", "0.0.0.0", "--port", "8080", "--limit-concurrency", "32"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *reviewer
    command: ["python", "-m", "app.cli", "worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["local-ai"]
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  reviewer-data:
  ollama-models:
